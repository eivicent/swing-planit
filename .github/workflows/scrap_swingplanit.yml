name: Scrape SwingPlanIt

on:
  schedule:
    - cron: "0 0 * * *" # 00:00 UTC daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: scrape-swingplanit
  cancel-in-progress: false

jobs:
  scrape:
    name: Test, scrape, and publish to data branch
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      DATA_BRANCH: data
      DATA_WORKTREE: .data_branch

    steps:
      - name: Checkout code (main)
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Restore cached R packages
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          packages: |
            any::rvest
            any::dplyr
            any::tibble
            any::stringr
            any::purrr
            any::readr
            any::tidyr
            any::httr2
            any::xml2
            any::testthat
            any::withr
          cache-version: 1

      - name: Run unit tests
        run: Rscript tests/testthat.R

      - name: Mount data branch as worktree
        run: |
          set -euo pipefail
          if ! git ls-remote --exit-code --heads origin "$DATA_BRANCH" > /dev/null; then
            echo "::error::'$DATA_BRANCH' branch does not exist on origin. Run the 'Bootstrap data branch' workflow once before scheduling daily scrapes."
            exit 1
          fi
          git fetch origin "$DATA_BRANCH" --depth=1
          git worktree add "$DATA_WORKTREE" "origin/$DATA_BRANCH"
          mkdir -p "$DATA_WORKTREE/daily_parse_data" "$DATA_WORKTREE/processed_data"
          rm -rf daily_parse_data processed_data
          ln -sfn "$DATA_WORKTREE/daily_parse_data" daily_parse_data
          ln -sfn "$DATA_WORKTREE/processed_data" processed_data

      - name: Run scraper
        run: Rscript scrape_swing_planit.R

      - name: Build metrics datasets
        run: Rscript build_metrics.R

      - name: Commit data-branch changes
        working-directory: ${{ env.DATA_WORKTREE }}
        run: |
          set -euo pipefail
          git add --all
          if git diff --cached --quiet; then
            echo "No data changes to commit."
            exit 0
          fi
          git -c user.name=github-actions \
              -c user.email=actions@github.com \
              commit -m "Daily scrape and metrics update on $(date -u +'%Y-%m-%d')"
          git push origin HEAD:"$DATA_BRANCH"

      - name: Open issue on failure
        if: failure()
        uses: actions/github-script@v7
        with:
          script: |
            const today = new Date().toISOString().slice(0, 10);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Scrape failed on ${today}`,
              body: `The scheduled scrape workflow failed. See run: ${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`,
              labels: ["scrape-failure"]
            });
